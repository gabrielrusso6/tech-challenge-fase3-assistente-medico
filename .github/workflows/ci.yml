name: Tests and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Tests including real LangGraph orchestration
        run: python -m pytest -v --junitxml=runtime/junit.xml
      - name: Dataset pipeline
        run: python -m tc3.dataset
      - name: Package wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            runtime/junit.xml
            runtime/dataset/analysis.json
            dist/*.whl
